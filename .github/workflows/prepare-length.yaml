name: Protected IR Viewer length migration
on:
  push:
    branches: [prepare/ir-viewer-length-0301]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"
      - name: Install exact published graph
        run: caps --ci --strict && yarn install --immutable && caps verify --toolchain
      - name: Original full gates and 10 business tests
        run: |
          set -euo pipefail
          mkdir -p acceptance
          test ! -e compact.cirru
          test ! -e package.cirru
          node prepare-length.mjs inspect
          node prepare-length.mjs before
          source_blob="$(git hash-object calcit.cirru)"
          calcit calcit.cirru edit format
          test "$(git hash-object calcit.cirru)" = "$source_blob"
          calcit calcit.cirru --check-only --all-defs > acceptance/before-all-defs.log
          calcit calcit.cirru fix --workflow strict --verify --format json > acceptance/before-strict.json
          jq -e '.data.workflow.status == "passed" and .diagnostics == []' acceptance/before-strict.json
          calcit calcit.cirru test app.comp.container/format-type-info --require-match > acceptance/before-native.log
          calcit calcit.cirru --check-only --ns app.comp.container --ns app.config --ns app.main --ns app.schema --ns app.storage --ns app.types --ns app.updater --summary-only > acceptance/before-public.log
          calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json > acceptance/before-dynamic.json
          jq -e '.data.summary.findings == 0' acceptance/before-dynamic.json
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru > acceptance/before-quality.log
          VITE_BASE_URL=./ yarn build
          node --test scripts/ir-viewer-regression.test.mjs > acceptance/before-tests.log
          node prepare-length.mjs before-js
      - name: Exact official source transaction
        run: node prepare-length.mjs apply
      - name: Candidate unchanged original gates and business tests
        run: |
          set -euo pipefail
          source_blob="$(git hash-object calcit.cirru)"
          calcit calcit.cirru edit format
          test "$(git hash-object calcit.cirru)" = "$source_blob"
          calcit calcit.cirru --check-only --all-defs > acceptance/after-all-defs.log
          calcit calcit.cirru fix --workflow strict --verify --format json > acceptance/after-strict.json
          jq -e '.data.workflow.status == "passed" and .diagnostics == []' acceptance/after-strict.json
          calcit calcit.cirru test app.comp.container/format-type-info --require-match > acceptance/after-native.log
          calcit calcit.cirru --check-only --ns app.comp.container --ns app.config --ns app.main --ns app.schema --ns app.storage --ns app.types --ns app.updater --summary-only > acceptance/after-public.log
          calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json > acceptance/after-dynamic.json
          jq -e '.data.summary.findings == 0' acceptance/after-dynamic.json
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru > acceptance/after-quality.log
          VITE_BASE_URL=./ yarn build
          node --test scripts/ir-viewer-regression.test.mjs > acceptance/after-tests.log
          node prepare-length.mjs after-js
          node prepare-length.mjs after
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: accepted-source
          path: calcit.cirru
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: accepted-runtime
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: diagnostics
          path: acceptance/
          if-no-files-found: error

