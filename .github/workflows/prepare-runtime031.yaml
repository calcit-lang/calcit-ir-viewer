name: Prepare isolated IR acceptance
on:
  push:
    branches: [prepare/ir-viewer-runtime031]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Prepare exact public source
        run: |
          set -euo pipefail
          test "$(git hash-object calcit.cirru)" = 06f800cd2de3dd8482d71d8ff3c20ee5282e717e
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          mkdir -p acceptance
      - name: Check heterogeneous IR values at actual read boundaries
        run: |
          set -euo pipefail
          calcit calcit.cirru tree replace app.comp.container/comp-file --path 3.2.1.0.1.1.0 --expect 'quote assert-type' --code 'quote decode-map-as'
          calcit calcit.cirru tree replace app.comp.container/comp-fn --path 3.2.2.1.2.0 --expect 'quote assert-type' --code 'quote decode-map-as'
          calcit calcit.cirru tree replace app.comp.container/comp-fn --path 3.2.2.1.4.0 --expect 'quote assert-type' --code 'quote decode-map-as'
          calcit calcit.cirru tree replace app.comp.container/comp-macro --path 3.2.2.1.2.0 --expect 'quote assert-type' --code 'quote decode-map-as'
          calcit calcit.cirru tree replace app.comp.container/comp-macro --path 3.2.2.1.4.0 --expect 'quote assert-type' --code 'quote decode-map-as'
          calcit calcit.cirru tree replace app.comp.container/comp-file-entry --path 3.2.5.2.3.1.3.1.3.1.4.1.0 --expect 'quote assert-type' --code 'quote decode-map-as'
          calcit calcit.cirru tree insert app.main/reload! --path 3 --at after --code 'quote &unit'
          calcit calcit.cirru fix --workflow strict --apply --format json > acceptance/surface-applied.json
          calcit calcit.cirru edit format
          cp calcit.cirru acceptance/calcit.cirru
          git hash-object calcit.cirru > acceptance/source-blob.txt
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru --format json > acceptance/quality.json
      - name: Collect strict failure without changing source
        run: |
          calcit calcit.cirru fix --workflow strict --verify --format json > acceptance/strict.json
        continue-on-error: true
      - name: Build isolated runtime and public IR
        env:
          VITE_BASE_URL: ./
        run: |
          set -euo pipefail
          yarn build
          node --test scripts/ir-viewer-regression.test.mjs
          calcit calcit.cirru test app.comp.container/format-type-info --require-match
          calcit calcit.cirru ir
          test -s js-out/program-ir.cirru
          cp js-out/program-ir.cirru acceptance/program-ir.cirru
          cp -R dist acceptance/dist
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ir-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance
          if-no-files-found: error
          retention-days: 7
